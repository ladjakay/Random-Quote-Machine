<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Machine</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Centered Container -->
  <main id="quote-box" class="quote-card">
    
    <!-- Quote Header Badges -->
    <div class="card-header">
      <span class="category-badge" id="category">Inspiration</span>
      <div class="action-tools">
        <button id="copy-btn" class="tool-btn" title="Copy to Clipboard">
          <i class="fa-regular fa-copy"></i>
        </button>
        <button id="speak-btn" class="tool-btn" title="Listen to Quote">
          <i class="fa-solid fa-volume-high"></i>
        </button>
      </div>
    </div>

    <!-- Quote Body -->
    <div class="quote-content">
      <i class="fa-solid fa-quote-left quote-icon"></i>
      <p id="text" class="quote-text">Loading wisdom...</p>
    </div>

    <!-- Quote Author -->
    <div class="quote-author-wrapper">
      <span class="dash">—</span>
      <p id="author" class="quote-author">Anonymous</p>
    </div>

    <!-- Controls / Action Buttons -->
    <div class="controls-wrapper">
      <div class="social-links">
        <a id="tweet-quote" class="button social-btn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer" title="Tweet this quote!">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a id="tumblr-quote" class="button social-btn" href="#" target="_blank" rel="noopener noreferrer" title="Post to Tumblr">
          <i class="fa-brands fa-tumblr"></i>
        </a>
      </div>

      <button id="new-quote" class="button primary-btn">
        <span>New Quote</span>
        <i class="fa-solid fa-arrows-rotate sync-icon"></i>
      </button>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast">Quote copied to clipboard!</div>

  <script src="script.js"></script>
</body>
</html>
